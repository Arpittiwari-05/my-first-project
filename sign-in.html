<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CampusRooming</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page" style="background-image:url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1400&q=80')">
  <div class="auth-overlay"></div>

  <!-- Back -->
  <a href="index.html" class="auth-back">← Back to home</a>

  <!-- Logo -->
  <div class="auth-logo-bar">
    <div class="logo-badge">CR</div>
    <span class="logo-text">CAMPUS<span class="logo-accent">ROOMING</span></span>
  </div>

  <!-- Card -->
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your CampusRooming account</p>

      <div class="auth-error" id="signinError" style="display:none"></div>

      <form id="signinForm" class="auth-form">

        <div class="form-group">
          <label for="signinEmail">Email address</label>
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input id="signinEmail" type="email" placeholder="you@example.com" />
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="signinPassword">Password</label>
            <button type="button" class="link-btn">Forgot password?</button>
          </div>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input id="signinPassword" type="password" placeholder="Enter your password" />
            <button type="button" class="toggle-pw" id="toggleSigninPw">👁</button>
          </div>
        </div>

        <div class="check-row">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me for 30 days</label>
        </div>

        <button type="submit" class="btn btn-dark btn-full" id="signinSubmit">Sign in</button>

      </form>

      <div class="divider"><span>or continue with</span></div>

      <div class="oauth-row">
        <button class="oauth-btn">
          <img src="https://www.google.com/favicon.ico" width="16" alt="Google" /> Google
        </button>
        <button class="oauth-btn">📱 Phone OTP</button>
      </div>

      <p class="auth-switch">
        New to CampusRooming?
        <a href="register.html">Create an account</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
