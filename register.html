<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — CampusRooming</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page" style="background-image:url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1400&q=80')">
  <div class="auth-overlay"></div>

  <a href="index.html" class="auth-back">← Back to home</a>

  <div class="auth-logo-bar">
    <div class="logo-badge">CR</div>
    <span class="logo-text">CAMPUS<span class="logo-accent">ROOMING</span></span>
  </div>

  <div class="auth-container">
    <div class="auth-card">

      <!-- Success Screen (hidden by default) -->
      <div id="registerSuccess" style="display:none; text-align:center;">
        <div class="success-icon">✅</div>
        <h2 class="auth-title">Account created!</h2>
        <p class="auth-subtitle" style="margin-bottom:1.5rem;">Welcome to CampusRooming. Start exploring rooms near your campus.</p>
        <a href="index.html" class="btn btn-dark btn-full">Explore rooms</a>
      </div>

      <!-- Form -->
      <div id="registerFormWrap">
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Find your perfect campus room</p>

        <!-- Role Toggle -->
        <div class="role-toggle" id="roleToggle">
          <button class="role-btn active" data-role="student">I'm a Student</button>
          <button class="role-btn" data-role="host">I'm a Host</button>
        </div>

        <div class="auth-error" id="registerError" style="display:none"></div>

        <form id="registerForm" class="auth-form">

          <div class="form-group">
            <label>Full name <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input id="regName" type="text" placeholder="Rahul Sharma" />
            </div>
          </div>

          <div class="form-group">
            <label>Email address <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input id="regEmail" type="email" placeholder="you@example.com" />
            </div>
          </div>

          <div class="form-group">
            <label>Phone number <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">📞</span>
              <input id="regPhone" type="tel" placeholder="+91 98765 43210" />
            </div>
          </div>

          <div class="form-group" id="collegeGroup">
            <label>College / University</label>
            <div class="input-wrap">
              <span class="input-icon">🎓</span>
              <select id="regCollege">
                <option value="">Select your college</option>
                <option>LNCT Bhopal</option>
                <option>MANIT Bhopal</option>
                <option>Barkatullah University</option>
                <option>RGPV Bhopal</option>
                <option>Sagar University</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Password <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input id="regPassword" type="password" placeholder="Min. 8 characters" />
              <button type="button" class="toggle-pw" id="toggleRegPw">👁</button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm password <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input id="regConfirm" type="password" placeholder="Repeat your password" />
              <button type="button" class="toggle-pw" id="toggleRegConfirm">👁</button>
            </div>
          </div>

          <div class="check-row">
            <input type="checkbox" id="terms" required />
            <label for="terms">
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-dark btn-full" id="registerSubmit">
            Create account
          </button>

        </form>

        <p class="auth-switch">
          Already have an account? <a href="sign-in.html">Sign in</a>
        </p>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
